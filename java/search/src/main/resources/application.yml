server:
  tomcat:
    connection-timeout: 300000
  port: 8201
elasticsearch-client:
    hosts: http://localhost:9200
module-name: search
spring:
  redis:
    host: localhost
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    #    hikari:
    #      max-lifetime: 2520000  7 小时
    #      idle-timeout: 21600000   6 小时
    #      validation-timeout: 5000  5 秒
    name: datasource
    url: jdbc:mysql://localhost:3306/bilibili?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: user
  application:
    name: search
#  cloud:
#    nacos:
#      discovery:
#        server-addr: 116.62.71.84:8848
#logging:
#  level:
#    springfox.documentation.spring.web: DEBUG
global-exception-handler:
  enabled: true

# -----------------------------------------------------------------------------
# 搜索相关度下限与同步任务（v2，2026-10-25）
#   min-score：ES 的 BM25 分数量级随语料规模变化 —— 空库/小语料时，精确命中标题的文档
#     score 可能只有 0.3~0.4，若用 1.0 的绝对阈值会被全部滤掉（接口 200 但结果恒空）。
#     本地默认 0.1 只做「完全不相干」的兜底去噪；语料上千条后应调回接近 1.0。
#   sync-cron：MySQL→ES 增量同步的触发频率。v2 起由 Spring @Scheduled 驱动
#     （原 xxl-job 调度中心从未注册过任务，链路自部署起一次都没跑过）。
# -----------------------------------------------------------------------------
bilibili:
  search:
    min-score: 0.1
    sync-cron: "0 0/1 * * * ?"
