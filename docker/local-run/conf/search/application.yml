# =============================================================================
# search —— 混合模式（应用在宿主、中间件在 Docker）本地覆盖
# 用法： .\run-backend.ps1 -Service search
# 依赖：MySQL + Redis + Elasticsearch + xxl-job-admin
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bilibili?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
  redis:
    host: 127.0.0.1
    port: 16379                       # 见 middleware-host.yml：容器 redis 发布在 16379
  zipkin:
    base-url: http://127.0.0.1:9411

elasticsearch-client:
  hosts: http://127.0.0.1:9200        # 容器模式为 http://elasticsearch:9200

xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8080/xxl-job-admin   # 容器模式为 http://xxl-job-admin:8080/...
    executor:
      # 执行器端口在宿主上跑，9916 空闲即可；若被占用可改这里
      port: 9916
      # 日志目录用**相对路径**（原值为容器内绝对路径 /data/applogs/...），
      # 相对 JVM 工作目录 docker/local-run/，避免往宿主盘根写东西
      logpath: var/xxl-job/logs
