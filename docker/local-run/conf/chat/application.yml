# =============================================================================
# chat —— 混合模式（应用在宿主、中间件在 Docker）本地覆盖
# 用法： .\run-backend.ps1 -Service chat
# 本服务不依赖 redis / minio / rocketmq，只需 MySQL（+ 惰性的 nacos、zipkin）
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bilibili?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
  zipkin:
    base-url: http://127.0.0.1:9411
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848   # 惰性键（V-1）
