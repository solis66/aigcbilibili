# =============================================================================
# notice —— 混合模式（应用在宿主、中间件在 Docker）本地覆盖
# 用法： .\run-backend.ps1 -Service notice
# 只写与 classpath 默认值不同的键；classpath 的 application.yml 已指向 localhost，
# 这里全部显式写成 127.0.0.1，规避 Windows 上 localhost 先解析到 IPv6 ::1 的问题。
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bilibili?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
  redis:
    host: 127.0.0.1
    port: 16379                       # 见 middleware-host.yml：容器 redis 发布在 16379
  zipkin:
    base-url: http://127.0.0.1:9411
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848   # 注：源码未引入 nacos 客户端，此键为惰性键（V-1）

rocketmq:
  # broker 已用 broker.host.conf 把 brokerIP1 注册成 127.0.0.1，宿主可直接回连 10911
  name-server: 127.0.0.1:9876
