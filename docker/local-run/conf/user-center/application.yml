# =============================================================================
# user-center —— 混合模式（应用在宿主、中间件在 Docker）本地覆盖
# 用法： .\run-backend.ps1 -Service user-center
# ⚠️ 目录名/服务名用连字符 user-center，Maven 模块名用下划线 user_center（D-02）
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bilibili?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8

minio:
  url: http://127.0.0.1:19000         # 宿主发布端口见 docker/.env 的 MINIO_API_HOST_PORT；容器模式为 http://minio:9000
