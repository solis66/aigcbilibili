# =============================================================================
# video —— 混合模式（应用在宿主、中间件在 Docker）本地覆盖
# 用法： .\run-backend.ps1 -Service video
# 注意 video 的 classpath 里 spring.servlet.multipart.location=var/temp 是**相对路径**，
# 相对的是 JVM 工作目录。run-backend.ps1 会把工作目录固定到 docker/local-run/，
# 并预建 var/temp，避免上传时因目录不存在而 500。
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bilibili?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
  redis:
    host: 127.0.0.1
    port: 16379                       # 见 middleware-host.yml：容器 redis 发布在 16379

minio:
  url: http://127.0.0.1:19000         # 宿主发布端口见 docker/.env 的 MINIO_API_HOST_PORT

rocketmq:
  name-server: 127.0.0.1:9876         # broker 已注册 127.0.0.1（broker.host.conf）
