# =============================================================================
# broker.host.conf —— 「中间件在 Docker、应用在宿主」混合模式专用
#
# 与 broker.conf 的唯一差异：brokerIP1 = 127.0.0.1（原为容器名 rocketmq-broker）
#
# 为什么必须改：
#   brokerIP1 是 broker 向 namesrv **注册的回连地址**，客户端从 namesrv 拿到它之后
#   会直接按这个地址去连 broker（不是连 namesrv 的地址）。
#     · 容器模式：brokerIP1=rocketmq-broker，只有容器网络内的 DNS 能解析 → 容器后端可用；
#     · 混合模式：宿主进程解析不了 rocketmq-broker 这个名字 → 生产者/消费者连不上 broker
#       （症状：notice/video 启动不报错，但一发消息就 timeout / "connect to null failed"）。
#   宿主侧 127.0.0.1:10911 已由 compose 发布到容器 10911，故注册成 127.0.0.1 即可回连。
#
# 使用方式（不要手动 -v 挂载！由 middleware-host.yml 覆盖 command 指向本文件）：
#   docker compose -f docker-compose.yml -f docker-compose.middleware-host.yml up -d ...
#
# 注：namesrvAddr 保持容器名 —— broker 连 namesrv 是「容器 → 容器」，仍走容器内 DNS。
# =============================================================================
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
namesrvAddr = rocketmq-namesrv:9876
brokerIP1 = 127.0.0.1
listenPort = 10911
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
