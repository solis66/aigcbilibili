# =============================================================================
# redis.conf —— 迁移自上一轮虚拟环境方案的 Redis 配置，并 Linux 化
# 关键改动：
#   bind 127.0.0.1  -> bind 0.0.0.0   容器内需被其它容器经服务名 redis 访问
#   protected-mode  -> no             本服务无密码，须关闭保护模式，否则跨容器连接被拒
#   dir             -> /data          对应命名卷 redis-data（原为 Windows 绝对路径）
#   logfile         -> ""（日志走 stdout，便于 docker logs 查看）
# 保留：save 900 1 / appendonly no（与上游一致）
# =============================================================================
port 6379
bind 0.0.0.0
protected-mode no
dir /data
dbfilename dump.rdb
logfile ""
save 900 1
appendonly no
