# =============================================================================
# broker.conf —— 迁移自上一轮虚拟环境方案的 RocketMQ broker 配置，并容器化
# 关键改动：
#   namesrvAddr   127.0.0.1:9876 -> rocketmq-namesrv:9876（容器名，D-02）
#   brokerIP1     127.0.0.1      -> rocketmq-broker（broker 向 namesrv 注册的地址，
#                                  客户端据此回连；必须用容器名，否则后端连不上）
#   storePath*    Windows 绝对路径 -> /home/rocketmq/store（对应命名卷 rocketmq-store）
# autoCreateTopicEnable：开启，兼容本项目「后端发送时按需建 topic」的行为
# 版本约束（D-10）：broker 必须 4.x（starter rocketmq-spring-boot-starter 仅 2.0.4）
# =============================================================================
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
namesrvAddr = rocketmq-namesrv:9876
brokerIP1 = rocketmq-broker
listenPort = 10911
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
