# =============================================================================
# gateway 外置配置 → 容器内 /app/config/application-dev.yml
# 依据 D-01：不改源码，走 Spring Boot 的 optional:file:./config/（优先级高于 classpath，逐属性覆盖）
# ⚠️ D-01 修订 R1（2026-09-22）：java/common 里 3 处 Feign url 已参数化 → 本文件新增 service: 段
# 文件名必须是 application-dev.yml —— gateway 的 classpath 走 dev profile（其 application.yml 仅一行 active: dev）
# 本文件写「完整键集」（架构 §4.1）；逐键对照表见《Docker架构设计》§4.2
# =============================================================================
server:
  port: 8200

spring:
  application:
    name: gateway
  main:
    allow-bean-definition-overriding: true          # 保留（D-01 点名；漏则 Bean 冲突启动失败）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    name: datasource
    url: jdbc:mysql://mysql:3306/bilibili?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: user
  redis:
    host: redis                                     # 容器名（原 localhost）
  cloud:
    loadbalancer:
      enabled: true                                 # 保留（D-01 点名）
    nacos:
      discovery:
        server-addr: nacos:8848                     # 容器名（注：V-1，对当前依赖可能为惰性键）
    gateway:
      discovery:
        locator:
          enabled: true                             # 保留（D-01 点名）
          lower-case-service-id: true               # 保留（D-01 点名）
      routes:                                       # 列表属性：外置定义整体替换 classpath（D-01 / F-02）
        - id: websocket
          uri: ws://chat:1688
          predicates:
            - Path=/ljl/chat
        - id: route1
          uri: http://notice:30000
          predicates:
            - Path=/changeNoticeStatus/**,/getNotice/**
        - id: route2
          uri: http://user-center:3000
          predicates:
            - Path=/ensemble/**,/follow/**,/selfCenter/**,/userInfo/**
        # ---------------------------------------------------------------------
        # FIX-18（2026-09-23，本机实测新增）：复刻「按服务名自动路由」的语义
        #   背景：上面 spring.cloud.gateway.discovery.locator.enabled=true 的作用，是把
        #     `/<服务名>/**` 自动路由到该服务并去掉前缀。但它依赖 nacos 里有服务注册，
        #     而本机 `service/list` 实测 **0 个服务**（且 video/search 的源码里 nacos 段是注释掉的）
        #     → 该机制整体空转，`/user-center/**` 一律 404（网关自己的 404，不是业务错误）。
        #   依据：这不是前端写错 —— gateway 的 SecurityConfig 第 33 行白名单里明确列了
        #     "/user-center/**"（说明上游线上就是靠 locator 自动生成这条路由），
        #     且 vue/labilibili/src/api/video.js 有 4 处调用：
        #       /user-center/ensemble/getAllVideoInEnsemble/{userId}/{videoId}  ← 视频详情页的合集
        #       /user-center/ensemble/getEnsembleList/{userId}                  ← 个人主页合集
        #       /user-center/ensemble/addOrUpDaterEnsemble                      ← 新建/修改合集
        #       /user-center/selfCenter/getRemotelyLikeVideo/{userId}           ← 最近点赞
        #   处置：用一条显式路由复刻 locator 的行为（Path=/user-center/** + StripPrefix=1），
        #     等价于 locator 生成的 RewritePath=/user-center/(?<remaining>.*), /${remaining}。
        #   判据：`curl http://localhost:8200/user-center/ensemble/getAllVideoInEnsemble/1/1` 由 404 → 200。
        #   缺这条时的症状：前端弹「查看视频合集中的视频失败：接受响应后的错误：」这类**通用**文案
        #     （axios 响应拦截器把真因吞了），看不出是 404 还是别的。
        # ---------------------------------------------------------------------
        - id: route2b
          uri: http://user-center:3000
          predicates:
            - Path=/user-center/**
          filters:
            - StripPrefix=1
        - id: route3
          uri: http://video:10201
          predicates:
            - Path=/collect/**,/comment/**,/danmaku/**,/videoToEnsemble/**,/like/**,/createCenter/**,/play/**
        - id: route4
          uri: http://chat:1688
          predicates:
            - Path=/chat/**
        - id: route5
          uri: http://search:8201
          predicates:
            - Path=/search/**
  zipkin:
    base-url: http://zipkin:9411                    # 容器名（原 localhost）
    sender:
      type: web
  sleuth:
    sampler:
      probability: ${ZIPKIN_SAMPLER_PROBABILITY:-0.1}  # F-16：默认 0.1 = 原实际行为；设 1 可看全链路
  mail:                                             # 原样保留（D-01 点名；容器化不改邮件配置）
    host: smtp.qq.com
    default-encoding: UTF-8
    username: localhost@qq.com
    password: localhost
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

module-name: gateway                                # 日志路径用（logback-spring.xml 的 ${module-name}）
global-exception-handler:
  enabled: false                                    # 保留原值

# -----------------------------------------------------------------------------
# 服务间调用地址（Feign 客户端 url 的占位符，见 java/common/.../client/）
# 容器内必须写容器名：容器里的 localhost 指自己，写死就 Connection refused
#   → 注册/登录/手机号登录/邮箱登录全部 500（RegisterServiceImpl 带 @Transactional 还会回滚）
# 宿主直跑无需配置 —— 注解里的默认值就是 http://localhost:<port>
# -----------------------------------------------------------------------------
service:
  notice:
    url: http://notice:30000                        # 注册/登录后同步用户数据给 notice

# -----------------------------------------------------------------------------
# 新用户默认头像 URL（FIX-13，2026-09-23 本机实测新增）
#   源码默认值 = 作者线上域名 https://labilibili.com/user-cover/default.png，
#   本地部署时该路径实测 **404**（那是线上存储，与本地 minio 无关）→ 新注册用户头像破图。
#   此处覆盖为本地入口，/user-cover/ 经前端 nginx 反代到 minio
#   （docker/frontend/nginx.conf 的 location ^~ /user-cover/）。
#   消费方：java/common/.../handler/MyMetaObjectHandler 与 gateway/LoginServiceImpl。
# -----------------------------------------------------------------------------
bilibili:
  user:
    default-cover: http://localhost:2023/user-cover/default.png
