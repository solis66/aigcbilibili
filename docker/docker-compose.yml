# =============================================================================
# aigcbilibili —— Docker Compose 主编排
# 口径：15 个逻辑单元 / 16 个物理容器（RocketMQ 拆 namesrv + broker 两容器，Q1 裁定）
#       = 中间件 9（物理）+ 后端 6 + 前端 1 = 16；另有一次性 minio-init（执行完即退出，不计常驻）
#
# 运行方式（默认 = 全套 16 容器，不带任何 profile）：
#   cd docker && docker compose up -d
#   # 或从仓库根：docker compose -f docker/docker-compose.yml up -d
#   （compose 项目目录 = 本文件所在目录 docker/，故 ./xxx 相对路径与 build 上下文 ../ 均以此为准）
#
# 低内存降级（lite 子集，跳过 nacos / elasticsearch / xxl-job-admin / zipkin / search，约省 3.3GB）：
#   cd docker && docker compose up -d mysql redis minio minio-init rocketmq-namesrv rocketmq-broker \
#       gateway notice user-center video chat frontend
#
# 为什么不用 compose profiles 表达 lite：Docker Compose 的 profiles 语义是「带 profiles 的服务
#   在未启用该 profile 时一律不启动」，无法表达「默认超集、可命名子集」——若给 nacos 等打
#   profiles:[lite] 反而会让默认 up -d 丢掉它们，违背「默认即全套」。故此处用**显式服务清单**，
#   语义等价且更直观（详见 docker/README.md「低内存降级」）。
#
# 所有宿主端口均已变量化（D-11）：任何冲突只改 .env，不改本文件。
# =============================================================================

name: aigcbilibili

# 公共片段：加入同一自定义 bridge 网络 + 重启策略
x-net: &x-net
  networks:
    - bilibili-net
  restart: unless-stopped

# 6 个后端共用同一 Dockerfile，仅 ARG MODULE 不同（架构 §6.2：deps 层跨服务共享，只播种一次）
x-backend-build: &x-backend-build
  context: ..
  dockerfile: docker/backend/Dockerfile

networks:
  bilibili-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
  es-data:
  minio-data:

services:
  # ===========================================================================
  # 中间件层（9 个物理容器 / 8 个逻辑单元）
  # ===========================================================================

  # ---- M1 nacos（仅环境完整性保留；V-1/D-12：后端未引入 nacos 客户端，不阻塞任何服务）----
  nacos:
    image: nacos/nacos-server:v1.4.7
    <<: *x-net
    container_name: nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "${NACOS_HOST_PORT:-8848}:8848"
    # FIX-9（2026-09-22 本机实测校准，D-08 限额修订）：
    #   实测稳态占用 712 MiB / 768m = 92.7%，贴近上限。JVM 堆固定 512m（见上方 JVM_XMS/XMX），
    #   其余为 metaspace + 直接内存 + 线程栈，故**抬高 cgroup 限额不增加堆占用**，只加安全余量。
    #   D-08 首版限额系无实测数据的估算，此处按真机数据回归校准（属 D-08 精神内的参数校准，非推翻）。
    mem_limit: 1024m
    healthcheck:
      # 依据：nacos/nacos-server:v1.4.7 基于 openjdk + CentOS 基底，官方文档化用法即用 curl 探活，
      #       镜像内确有 curl（D-14 判定可用）。
      # 注：D-12 要求 nacos 不得成为任何后端的启动阻塞依赖 —— 本文件无任何服务 depends_on 它。
      test: ['CMD-SHELL', 'curl -fs http://localhost:8848/nacos/actuator/health || curl -fs http://localhost:8848/nacos/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ---- M2 mysql（业务库 bilibili；D-10 锁 5.7）----
  mysql:
    image: mysql:5.7.44
    <<: *x-net
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-user}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bilibili}
    # FIX-6（2026-09-22 本机实测新增）：
    #   现象：容器日志持续告警 `[Warning] World-writable config file
    #         '/etc/mysql/conf.d/zz-aigcbilibili.cnf' is ignored.` —— 外置调优**全部未生效**。
    #   根因：Docker Desktop(Windows) 的 bind 挂载把宿主文件呈现为 0777；MySQL 出于安全策略
    #         拒绝加载 world-writable 的配置文件，`…:ro` 只读挂载**不改变文件 mode**，故救不了。
    #   实际后果（非致命但真实）：
    #     · default-time-zone 丢失 → 容器内服务端时区为 UTC，而 6 个后端的外置 yml 里 JDBC URL
    #       统一声明 serverTimezone=GMT+8 → **服务端 NOW()/CURRENT_TIMESTAMP 与应用写入值相差 8 小时**；
    #     · character-set-server 回落 latin1（01-schema.sql 建表自带 utf8mb4，暂未暴露问题）；
    #     · innodb_buffer_pool_size / max_connections 回落默认值。
    #   处置：不再依赖外置文件，直接在 mysql 官方镜像 entrypoint 支持的位置下传 mysqld 参数
    #         （entrypoint 检测到首个参数以 `-` 开头会自动前置 `mysqld`）。
    #         优点：无需构建派生镜像、无文件权限问题、参数随 compose 版本化。
    #         注：`docker/middleware/mysql.cnf` 保留在仓库内仅作历史参照，已不再被挂载。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --default-storage-engine=INNODB
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      # 初始化 SQL 按文件数字前缀 01/02/03 顺序执行（仅在空数据卷时执行一次）
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 768m
    healthcheck:
      # 依据：mysql 官方镜像自带 mysqladmin（D-14 判定可用）。
      # 竞态说明（架构 §5.4 陷阱①）：官方 entrypoint 在 init 期间以 --skip-networking 启动临时实例，
      #   故 -h 127.0.0.1 走 TCP 的 ping 在此期间必然失败，只有正式实例起来（TCP 开放）才成功
      #   —— 天然规避「表还没建好就判健康」。
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---- M3 redis（D-11：默认不发布到宿主，仅内部网络暴露）----
  redis:
    image: redis:7.0.15-alpine
    <<: *x-net
    container_name: redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./middleware/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # ⚠️ D-11：宿主 6379 已被常驻 redis-server（PID 6640）占用，绝不能把宿主端口写成 6379（会导致 up 整体失败）。
    # 默认不发布；如需宿主直连，取消下面两行注释，并先在 .env 把 REDIS_HOST_PORT 设为 16379（勿用 6379）。
    # ports:
    #   - "${REDIS_HOST_PORT:-16379}:6379"
    expose:
      - "6379"
    mem_limit: 192m
    healthcheck:
      # 依据：redis:7.0.15-alpine 为 busybox 系，redis-cli 由镜像自带（D-14 判定可用）。
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---- M4 minio（对象存储；D-14：基于 ubi-micro，既无 bash 也无 curl，不加 healthcheck）----
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    <<: *x-net
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    mem_limit: 256m
    # 依据（D-14 铁律）：minio 官方镜像基于 ubi-micro，既无 bash 也无 curl —— 任何 shell/curl 形式的
    #   healthcheck 都会永久 unhealthy。故**刻意不加** healthcheck，由 minio-init 的 service_started
    #   + 重试逻辑兜底（宁可不加，也不制造级联阻塞）。

  # ---- minio-init（一次性：创建 user-cover 桶；执行完即退出，不计入 16 常驻容器）----
  minio-init:
    # FIX-3（2026-09-22 本机实测新增）：原锁定 tag RELEASE.2023-03-20T20-16-18Z 已不可得 ——
    #   daocloud（error from registry: denied）、docker.1ms.run（not found）、
    #   quay.io/minio（not found）三处均失败；同 tag 的 minio/minio 侧却仍可正常拉取。
    #   实测可得的最近 RELEASE 为 2024-11-21，故**仅上调 mc 侧 tag**：
    #   mc 通过 S3 协议访问，与 2023 版 server 兼容；server 维持 D-10 锁定，缩小改动面。
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    networks:
      - bilibili-net
    container_name: minio-init
    depends_on:
      # minio 无 healthcheck（D-14），退化为 service_started；用 until 重试兜底等待其就绪
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # FIX-14（2026-09-23 本机实测新增）：由「只建一个桶」改为**桶列表**。
      #   动因：video 服务的 MinioServiceImpl 里桶名是硬编码的 video（视频）与 video-cover（封面），
      #        而原 init 只建了 user-cover → 视频投稿必抛 NoSuchBucket。
      #        注意 uploadImgFile 把异常整个吞掉（catch 后仍 return true），
      #        所以现象是「封面静默失败、视频分片接口报上传失败」，很容易误判成前端问题。
      #   选择用环境变量列表（而非循环里写死三个 mc mb）是为了保持「桶清单可配置」这一原有设计意图。
      MINIO_BUCKETS: ${MINIO_BUCKETS:-user-cover video video-cover}
    # FIX-5（2026-09-22 本机实测新增）：
    #   现象：minio-init 秒退，日志 `mc: -c: line 2: syntax error: unexpected end of file`，
    #         实测 `mc ls local` 为空 —— **user-cover 桶从未创建**（封面/头像上传会失败）。
    #   根因：原写法用 YAML **折叠标量 `>`** 承载多行脚本，而 compose 对**字符串形态**的 command
    #         会按空白做 shell 分词成 argv，实测容器 Cmd 被拆成
    #         ["until","mc","alias","set","local","http://minio:9000","$MINIO_ROOT_USER","$MINIO_ROOT_PASSWORD"]。
    #         于是 `sh -c` 只拿到第一个词 `until`，脚本内容全变成了位置参数 → 语法错误。
    #   处置：改为**列表形态**（单元素 + 多行块标量 `|`）。列表不会被分词，整段脚本完整传给 sh -c。
    #         同时把「分号连写」改为「换行 + 去掉分号」，可读性与健壮性都更好。
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..."; sleep 2;
        done
        # FIX-14：按桶列表逐个创建 + 开放匿名下载。
        #   匿名下载（anonymous download）是 nginx 的 /user-cover/、/video/、/video-cover/
        #   能直接匿名 GET 的前提 —— 不开则反代过去是 403 AccessDenied。
        for b in $$MINIO_BUCKETS; do
          mc mb --ignore-existing local/"$$b"
          mc anonymous set download local/"$$b"
          echo "bucket '$$b' ready"
        done
        # FIX-13（2026-09-23 本机实测新增）：播种默认头像。
        #   动因：库中 user.cover 与源码默认值都指向 user-cover/default.png，但原 init 只建桶、
        #         从不放对象 → 该 URL 永远 404，**所有默认头像破图**。
        #   素材来源：docker/minio/default.png（由 vue/src/assets/img/avater.png 复制而来）。
        #   mc cp 幂等覆盖，重跑安全。仅头像桶需要播种，故此处写死桶名（不再跟随 $$MINIO_BUCKET）。
        mc cp /seed/default.png local/user-cover/default.png
    restart: "no"
    volumes:
      # FIX-13：/seed 只读挂载播种素材目录（缺挂载则 mc cp 找不到源文件）
      - ./minio:/seed:ro

  # ---- M5a rocketmq-namesrv（D-10 锁 4.x）----
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    <<: *x-net
    container_name: rocketmq-namesrv
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms${NAMESRV_JVM_XMS:-256m} -Xmx${NAMESRV_JVM_XMX:-256m} -Xmn128m"
    ports:
      - "${ROCKETMQ_NAMESRV_HOST_PORT:-9876}:9876"
    mem_limit: 512m
    healthcheck:
      # 依据：apache/rocketmq:4.9.7 基于 openjdk:8-jre-slim（Debian 基底，含 bash），
      #       故用 bash 的 /dev/tcp 探 9876（D-14 判定可用）。
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/9876"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- rocketmq-store-init（一次性：修正命名卷属主；执行完即退出，不计入常驻容器）----
  # FIX-4（2026-09-22 本机实测新增）：
  #   现象：rocketmq-broker 反复退出、**退出码 253 且 docker logs 完全为空**，
  #         连带 depends_on 它的 notice / video 无法启动（compose 报 "container rocketmq-broker is unhealthy"）。
  #   根因（三步对照实验定位，见 deliverables 记录）：
  #     ① 不挂卷、不设内存限制 → broker 正常 `boot success`（基准可用）；
  #     ② 只挂卷 rocketmq-store、不设内存限制 → 同样 Exit 253（**复现**）；
  #     ③ 命名卷由 Docker 以 root:root(755) 创建，而 broker 以 uid=3000(rocketmq) 运行，
  #        且镜像内 /home/rocketmq 为 drwx------ —— 非 root 进程无法在卷内建 storePath 目录，
  #        mqbroker 脚本在早期即退出，故**一行日志都没有**（这也是最难查的地方）。
  #   处置：沿用本项目 minio-init 的既有范式（一次性 init + depends_on 串行），
  #         由 root 先把卷 chown 给 3000:3000，broker 维持**非 root** 运行。
  #   图像选型：复用已锁定的 redis:7.0.15-alpine（busybox 自带 chown），不新增镜像依赖。
  rocketmq-store-init:
    image: redis:7.0.15-alpine
    <<: *x-net
    container_name: rocketmq-store-init
    user: root
    volumes:
      - rocketmq-store:/store
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 3000:3000 /store && echo 'rocketmq-store owner -> 3000:3000 ready'"]
    restart: "no"

  # ---- M5b rocketmq-broker（D-08：默认堆过大，显式限制 ≤768m）----
  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    <<: *x-net
    container_name: rocketmq-broker
    command: sh mqbroker -c /home/rocketmq/broker.conf
    environment:
      # FIX-15（2026-09-23 本机实测新增）—— -XX:-UseContainerSupport 不可省
      #   现象：**所有**消费者的 Pull 请求 100% 失败，消息只积压不消费
      #     （video-encode-group Diff 恒为 2、mysql-es-group 同样报错），
      #     前端可见症状 = 投稿后 video.length 恒为 NULL（时长不显示）、MySQL→ES 同步不动。
      #     broker 侧 remoting.log 从容器启动第一秒起就刷：
      #       ERROR PullMessageThread - process request exception
      #       java.lang.NoClassDefFoundError: Could not initialize class
      #         org.apache.rocketmq.store.StoreUtil
      #         at DefaultMessageStore.checkInDiskByCommitOffset(DefaultMessageStore.java:1264)
      #   根因链（在 broker 容器内 javac 写 10 行复现程序实测，**不是 RocketMQ 的缺陷**）：
      #     StoreUtil.<clinit>
      #       -> ManagementFactory.getOperatingSystemMXBean()
      #       -> sun.management.OperatingSystemImpl.<init>(:182)
      #       -> Container.metrics() -> CgroupSubsystemFactory.create()
      #       -> jdk.internal.platform.cgroupv2.CgroupV2Subsystem.getInstance()  ==> NullPointerException
      #     即：**JDK 8u372 的 cgroup v2 探测在 Docker Desktop（WSL2，cgroup v2）下抛 NPE**
      #     （apache/rocketmq:4.9.7 基于 openjdk 8u372）。StoreUtil 类初始化因此永久失败，
      #     而 checkInDiskByCommitOffset 是每次 getMessage 的必经路径 → Pull 全挂。
      #   处置：关掉 JVM 的容器感知（-XX:-UseContainerSupport）。实测同一复现程序 INIT_OK。
      #     为什么安全：Xms/Xmx/Xmn 已显式写死（768m/768m/256m），关掉后 JVM **不会**
      #       按宿主内存重算堆，故不存在"堆涨到超出 mem_limit 被 OOM Kill"的风险；
      #       唯一代价是 StoreUtil 改用宿主内存(≈11.5G)而非 cgroup 限额(1280m)来估算
      #       "消息驻留内存还是落盘"的阈值（accessMessageInMemoryMaxRatio），属纯启发式，无副作用。
      #     试过无效的替代方案（勿再试）：-Djdk.internal.platform.metrics.disabled=true。
      #   判据：① docker exec rocketmq-broker grep -c NoClassDefFoundError \
      #            /home/rocketmq/logs/rocketmqlogs/remoting.log  不再增长；
      #         ② mqadmin consumerProgress -g video-encode-group 的 Diff 归 0；
      #         ③ video 表 length 列由 NULL 变为 "00:0X"。
      JAVA_OPT_EXT: "-Xms${BROKER_JVM_XMS:-768m} -Xmx${BROKER_JVM_XMX:-768m} -Xmn256m -XX:-UseContainerSupport"
    ports:
      - "${ROCKETMQ_BROKER_HOST_PORT:-10911}:10911"
    expose:
      - "10909"
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - ./middleware/broker.conf:/home/rocketmq/broker.conf:ro
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      # FIX-4：等属主修正完成再启动，避免在 root 属主的卷上以 uid3000 写入失败
      rocketmq-store-init:
        condition: service_completed_successfully
    # FIX-9（2026-09-22 本机实测校准，D-08 限额修订）—— 三项限额中**本条最紧要**：
    #   实测稳态占用 968.8 MiB / 1024m = **94.6%**，为全部容器之首。RocketMQ 以 mmap 写 commitlog，
    #   **页缓存计入 cgroup 内存统计**，故实际压力随消息吞吐增长而增长；一旦触顶即 OOM Kill broker，
    #   连带 notice / video 因 depends_on(service_healthy) 无法启动（故障半径远大于 Broker 自身）。
    #   堆仍锁 768m，抬高限额只增加 off-heap + 页缓存余量，不增加常驻占用。
    mem_limit: 1280m
    healthcheck:
      # 依据：同 namesrv（openjdk:8-jre-slim 含 bash），探 broker 10911。
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/10911"']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ---- M6 elasticsearch（D-10 锁 7.13.3，与客户端严格一致；D-08 单节点 512m 堆）----
  elasticsearch:
    image: elasticsearch:7.13.3
    <<: *x-net
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1536m
    healthcheck:
      # 依据：elasticsearch 官方镜像自带 curl（D-14 判定可用）。
      # ES 启动慢，start_period 给足 60s。
      test: ['CMD-SHELL', 'curl -fs "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s" || exit 1']
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ---- M7 zipkin（P1；采样默认 0.1，可由 ZIPKIN_SAMPLER_PROBABILITY 上调至 1 看全链路）----
  zipkin:
    image: openzipkin/zipkin:2.24.3
    <<: *x-net
    container_name: zipkin
    environment:
      STORAGE_TYPE: mem
    ports:
      - "${ZIPKIN_HOST_PORT:-9411}:9411"
    mem_limit: 512m
    healthcheck:
      # 依据：openzipkin/zipkin:2.24.3 为 Alpine 系，含 busybox 的 wget（D-14 标注「较稳」），
      #       且该镜像无 curl —— 故用 wget 探 /health。
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:9411/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- M8 xxl-job-admin（P1；D-13：排启动顺序末尾，绝不阻塞 search）----
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.3.1
    <<: *x-net
    container_name: xxl-job-admin
    environment:
      # 该镜像的标准做法：用 PARAMS 透传 Spring Boot 命令行参数（D-13）。
      # 数据源指向 mysql:3306/xxl_job（独立库，由 03-xxl-job.sql 建）。默认账号 admin / 123456。
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-user}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-default_token}
    ports:
      - "${XXL_JOB_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # FIX-9（2026-09-22 本机实测校准，D-08 限额修订）：
    #   实测稳态占用 474 MiB / 512m = 92.6%。admin 未显式设堆，Java 8 在 cgroup 感知下按限额推算，
    #   故原 512m 限额同时压住了堆与 off-heap；抬到 640m 后堆有余量，调度中心不会在任务量上升时先僵。
    mem_limit: 640m
    healthcheck:
      # 依据：xuxueli/xxl-job-admin:2.3.1 基于 openjdk:8-jre-slim（Debian，含 bash，无 curl），
      #       故用 bash 的 /dev/tcp 探 8080（D-14 允准的写法之一）。
      # 注：D-13 —— 没有任何服务以 service_healthy 依赖本容器，即使它较慢/异常也不会阻塞 search。
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/8080"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ===========================================================================
  # 后端服务层（6 个；均用 eclipse-temurin:8-jre 运行，含 bash）
  # 依赖原则：仅 depends_on 真正有效的中间件（D-12：不依赖 nacos）；
  #          gateway 不依赖各后端（运行期路由重试，避免环/长链）。
  # ===========================================================================

  # ---- B1 gateway ----
  gateway:
    build:
      <<: *x-backend-build
      args:
        MODULE: gateway
    image: aigcbilibili/gateway:1.0
    <<: *x-net
    container_name: gateway
    environment:
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--Xms256m -Xmx512m -Duser.home=/app}
      ZIPKIN_SAMPLER_PROBABILITY: ${ZIPKIN_SAMPLER_PROBABILITY:-0.1}
    ports:
      - "${GATEWAY_HOST_PORT:-8200}:8200"
    volumes:
      # 外置配置（D-01）：file:./config/ 优先级高于 classpath，逐属性覆盖，零源码改动
      - ./config/gateway:/app/config:ro
      # 日志落宿主可读位置（D-07）
      - ./logs/gateway:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # FIX-9b（2026-09-22 本机实测校准，沿用 D-08 R1 同一规则）：
    #   实测稳态 547.5 MiB / 640m = 85.6%，触发「≥85% 即校准」阈值。
    #   根因同 broker：堆固定 512m，但 -Xms 仅 256m，堆随负载向 -Xmx 增长时 RSS 还会再涨约 120m
    #   → 极可能在流量上升时被 cgroup OOM Kill（gateway 被杀会全站 502，故障半径最大）。
    #   校准为 1024m：堆占限额 50%，符合「JVM 容器限额 ≥ 堆 ×1.5」通行准则。堆不动。
    mem_limit: 1024m
    healthcheck:
      # 依据（V-2）：后端无 actuator；eclipse-temurin:8-jre 含 bash，用 /dev/tcp 探 8200。
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/8200"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ---- B2 notice ----
  notice:
    build:
      <<: *x-backend-build
      args:
        MODULE: notice
    image: aigcbilibili/notice:1.0
    <<: *x-net
    container_name: notice
    environment:
      JAVA_OPTS: ${NOTICE_JAVA_OPTS:--Xms512m -Xmx768m -Duser.home=/app}
      ZIPKIN_SAMPLER_PROBABILITY: ${ZIPKIN_SAMPLER_PROBABILITY:-0.1}
    ports:
      - "${NOTICE_HOST_PORT:-30000}:30000"
    volumes:
      - ./config/notice:/app/config:ro
      - ./logs/notice:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    mem_limit: 1024m
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/30000"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ---- B3 user-center（⚠️ DNS/服务名用连字符 user-center；module-name 用下划线 user_center）----
  user-center:
    build:
      <<: *x-backend-build
      args:
        MODULE: user_center
    image: aigcbilibili/user-center:1.0
    <<: *x-net
    container_name: user-center
    environment:
      JAVA_OPTS: ${USER_CENTER_JAVA_OPTS:--Xms256m -Xmx512m -Duser.home=/app}
      ZIPKIN_SAMPLER_PROBABILITY: ${ZIPKIN_SAMPLER_PROBABILITY:-0.1}
    ports:
      - "${USER_CENTER_HOST_PORT:-3000}:3000"
    volumes:
      - ./config/user-center:/app/config:ro
      - ./logs/user-center:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      # minio 无 healthcheck（D-14），退化为 service_started
      minio:
        condition: service_started
    # FIX-9b（2026-09-22 本机实测校准，沿用 D-08 R1 同一规则）：
    #   实测稳态 559.3 MiB / 640m = 87.4%（本项目后端中占用率最高者）。堆 512m 固定，
    #   堆向 -Xmx 增长即可触顶 → 头像/资料上传将 500。校准为 1024m（堆占 50%），堆不动。
    mem_limit: 1024m
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/3000"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ---- B4 video ----
  video:
    build:
      <<: *x-backend-build
      args:
        MODULE: video
    image: aigcbilibili/video:1.0
    <<: *x-net
    container_name: video
    environment:
      JAVA_OPTS: ${VIDEO_JAVA_OPTS:--Xms512m -Xmx768m -Duser.home=/app}
      ZIPKIN_SAMPLER_PROBABILITY: ${ZIPKIN_SAMPLER_PROBABILITY:-0.1}
    ports:
      - "${VIDEO_HOST_PORT:-10201}:10201"
    volumes:
      - ./config/video:/app/config:ro
      - ./logs/video:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      rocketmq-broker:
        condition: service_healthy
    mem_limit: 1024m
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/10201"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ---- B5 chat（WebSocket 私聊；nginx /wschat 上游）----
  chat:
    build:
      <<: *x-backend-build
      args:
        MODULE: chat
    image: aigcbilibili/chat:1.0
    <<: *x-net
    container_name: chat
    environment:
      JAVA_OPTS: ${CHAT_JAVA_OPTS:--Xms256m -Xmx512m -Duser.home=/app}
      ZIPKIN_SAMPLER_PROBABILITY: ${ZIPKIN_SAMPLER_PROBABILITY:-0.1}
      # FIX-22/23：讯飞星火凭据。真实值只存在 docker/.env（已 gitignore），此处仅透传，不入库。
      #   缺省为空串 → 容器照常启动，只是星火鉴权失败（启动期有 WARN 明确提示）。
      #   ⚠️ docker/.env 只是 compose 的变量源，**不会自动注入容器** ——
      #      凡是要进容器的变量，都必须在这里显式写一行，否则填了也不生效。
      #   ⚠️ compose 的 ${V:-d} 与 Spring 的 ${V:d} 语义不同：前者"未设或为空都用 d"，
      #      后者"未定义才用 d，定义为空串则取空串"。所以回落必须在这里（compose 层）写完，
      #      若改成裸透传空串，会反过来把 yml 里的默认值顶成空。
      #   TTI / AIPPT 未单独配置时，用嵌套默认值回落复用对话凭据（与改造前共用一组常量一致）。
      SPARK_CHAT_APP_ID: ${SPARK_CHAT_APP_ID:-}
      SPARK_CHAT_API_KEY: ${SPARK_CHAT_API_KEY:-}
      SPARK_CHAT_API_SECRET: ${SPARK_CHAT_API_SECRET:-}
      # TTI 文生图（留空 → 回落对话凭据；domain 是该能力在应用下的专属域，可单独覆盖）
      SPARK_TTI_APP_ID: ${SPARK_TTI_APP_ID:-${SPARK_CHAT_APP_ID:-}}
      SPARK_TTI_API_KEY: ${SPARK_TTI_API_KEY:-${SPARK_CHAT_API_KEY:-}}
      SPARK_TTI_API_SECRET: ${SPARK_TTI_API_SECRET:-${SPARK_CHAT_API_SECRET:-}}
      SPARK_TTI_DOMAIN: ${SPARK_TTI_DOMAIN:-s291394db}
      # AIPPT 生成 PPT（留空 → 回落对话凭据）
      SPARK_AIPPT_APP_ID: ${SPARK_AIPPT_APP_ID:-${SPARK_CHAT_APP_ID:-}}
      SPARK_AIPPT_API_KEY: ${SPARK_AIPPT_API_KEY:-${SPARK_CHAT_API_KEY:-}}
      SPARK_AIPPT_API_SECRET: ${SPARK_AIPPT_API_SECRET:-${SPARK_CHAT_API_SECRET:-}}
    ports:
      - "${CHAT_HOST_PORT:-1688}:1688"
    volumes:
      - ./config/chat:/app/config:ro
      - ./logs/chat:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    # FIX-9b（2026-09-22 本机实测校准，沿用 D-08 R1 同一规则）：
    #   实测稳态 551.6 MiB / 640m = 86.2%。私聊 WebSocket 长连接会持续累积线程栈与直接内存，
    #   是本组里**随时间增长最确定**的一个（连接数上来即涨）。校准为 1024m（堆占 50%），堆不动。
    mem_limit: 1024m
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/1688"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ---- B6 search（P1；依赖 ES + xxl-job-admin，但 admin 不得阻塞它，D-13）----
  search:
    build:
      <<: *x-backend-build
      args:
        MODULE: search
    image: aigcbilibili/search:1.0
    <<: *x-net
    container_name: search
    environment:
      JAVA_OPTS: ${SEARCH_JAVA_OPTS:--Xms384m -Xmx640m -Duser.home=/app}
      ZIPKIN_SAMPLER_PROBABILITY: ${ZIPKIN_SAMPLER_PROBABILITY:-0.1}
    ports:
      - "${SEARCH_HOST_PORT:-8201}:8201"
    expose:
      - "9916"          # xxl-job executor 端口，仅内部暴露
    volumes:
      - ./config/search:/app/config:ro
      - ./logs/search:/app/logs
      - ./logs/search-xxljob:/data/applogs/xxl-job/jobhandler
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      # D-13：admin 只做启动顺序，绝不用 service_healthy —— executor 容忍 admin 下线，
      #       即便 admin 慢/异常也不得阻断 search 启动。
      xxl-job-admin:
        condition: service_started
    # FIX-9b（2026-09-22 本机实测校准，沿用 D-08 R1 同一规则）：
    #   实测稳态 664.2 MiB / 768m = 86.5%。堆 640m + ES 客户端缓冲/direct memory 已吃掉大半，
    #   全量重建索引（xxl-job 触发）时堆必然增长 → 触顶即中断索引任务。
    #   校准为 1024m：堆占限额 62.5%，仍在「≤ 堆 ×1.5」准则内。堆不动。
    mem_limit: 1024m
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/8201"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ===========================================================================
  # 前端层（1 个；生产静态构建 + nginx，Q2 裁定）
  # ===========================================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    image: aigcbilibili/frontend:1.0
    <<: *x-net
    container_name: labilibili-front
    ports:
      - "${FRONTEND_HOST_PORT:-2023}:80"
    # FIX-10（2026-09-22 本机实测新增）：把 nginx.conf 以只读方式挂进来。
    #   动因：镜像里虽已 COPY 一份，但改配置就得**重建镜像**（rebuild 会重跑 webpack 构建，数分钟）；
    #         挂载后改配置只需 `docker exec labilibili-front nginx -s reload`，秒级生效。
    #   注：挂载内容会**覆盖**镜像内 /etc/nginx/conf.d/default.conf（这正是我们要的效果）；
    #       因此本文件与 docker/frontend/nginx.conf 必须始终一致，改配置**优先改仓库文件**。
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started
    mem_limit: 128m
    healthcheck:
      # 依据：nginx:1.25.4-alpine 基于 Alpine，含 busybox 的 wget（无 curl），探根路径。
      # FIX-7（2026-09-22 本机实测新增）—— 假探针，属 D-14 铁律点名的情形：
      #   现象：frontend 持续 `unhealthy`（FailingStreak=19），但服务完全正常
      #         （容器内 `wget 127.0.0.1` rc=0；宿主 http://localhost:2023 返回 200）。
      #   根因：原探针用 `http://localhost/`，容器内 /etc/hosts 为
      #         `::1 localhost` + `127.0.0.1 localhost`，busybox wget 实测先解析到 IPv6：
      #         `Connecting to localhost ([::1]:80)` → Connection refused；
      #         而 nginx.conf 是 `listen 80;`，**只绑 IPv4**，IPv6 无监听。
      #   处置：探针改用字面量 127.0.0.1，与本文件其余探针（后端统一 /dev/tcp/127.0.0.1/<port>）口径一致。
      #   （未改 nginx.conf 加 IPv6 listen：改动面更大，且对 SNI/代理语义无收益。）
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
