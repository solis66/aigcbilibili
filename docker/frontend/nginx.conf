# =============================================================================
# nginx.conf —— 复刻 vue.config.js devServer 的代理语义（D-05 / 架构 §7）
#   /api/    -> gateway:8200，去掉 /api 前缀（等价设了 VUE_APP_API_TARGET 时的 pathRewrite {'^/api':''}）
#   /wschat  -> chat:1688，WebSocket 透传（Upgrade/Connection 头）
#   SPA 回退 -> try_files $uri $uri/ /index.html
# html 根 = /usr/share/nginx/html（由 Dockerfile 从 builder 的 dist/ 拷入；assetsDir:'./' 产物平铺）
# 注：/video-test 外网样例视频代理不在容器内复刻（非 P0）
# =============================================================================
server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # FIX-14（2026-09-23 本机实测新增）：放开请求体上限。
    #   现象：投稿视频时本机 nginx 直接返回 **413 Request Entity Too Large**（HTML 页而非 JSON），
    #         请求根本没到网关 —— 实测 curl 一个 2.4MB 的 mp4 就 413。
    #   根因：nginx 默认 client_max_body_size = 1m，而前端分片上传的 chunkSize 就是 6MB
    #         （vue/labilibili/src/pages/user/upVideo/upLoad.vue）→ 每个分片都超限，
    #         也就是「无论多大的视频都传不上去」。
    #   取值：backend video 侧 spring.servlet.multipart.max-request-size=350MB，此处刻意略大于它，
    #         让**后端**成为权威限制并返回 JSON 错误，而不是被 nginx 用无信息的 413 HTML 页拦掉。
    client_max_body_size 360m;

    # 1) /api/ -> gateway:8200，去掉 /api 前缀
    # FIX-10（2026-09-22 本机实测新增）—— 消除「重建 gateway 后前端 502」的隐患：
    #   现象：重建 gateway 容器后，http://localhost:2023/api/... 立刻返回 502，
    #         而直连 http://localhost:8200/... 仍 200；重启 frontend 容器即恢复。
    #   根因：原写法 `proxy_pass http://gateway:8200/;` 的上游是**字面主机名**，
    #         nginx 只在**配置加载时解析一次**并永久缓存 IP。容器重建会更换 IP，
    #         nginx 仍把请求发往旧 IP → connect() failed (111: Connection refused)。
    #         实测证据（nginx error.log）：
    #           upstream: "http://172.18.0.6:8200/getNotice/getNoticeCount/1"
    #         而 gateway 当时的真实 IP 已是 172.18.0.7。
    #   处置：改为**变量形式** proxy_pass + Docker 内置 DNS(127.0.0.11) 动态解析。
    #         注意：变量形式下 nginx 不再自动做前缀剥离（原靠 proxy_pass 末尾斜杠实现），
    #         故显式用 `rewrite ... break` 完成 /api → / 的等价改写（query string 自动保留）。
    #   `valid=10s` **必须显式给**：Docker 内置 DNS 响应 TTL 为 600s，不显式限制则
    #         最长 10 分钟内仍指向旧 IP，等于没修。
    location /api/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $gw_upstream gateway:8200;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://$gw_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                      # 兼容 search 的 300000ms 超时
    }

    # 2) /wschat -> chat:1688，WebSocket 透传，**路径改写为真实端点 /ljl/bilibili/chat**
    # FIX-10：同 /api/，改变量形式以支持动态解析（chat 容器重建后不再 502）。
    # FIX-17（2026-09-23 本机实测新增）—— 原写法「保持原路径」是**错的**：
    #   现象：进「我的消息」页立刻弹 `WebSocket error出错：[object Event]`，
    #         浏览器 Console 为 `WebSocket connection to 'ws://localhost:2023/wschat' failed`。
    #   根因：`/wschat` 只是**前端 dev-server 的代理前缀**（vue/labilibili/vue.config.js 的
    #         devServer.proxy 里 `/wschat` 一段），**后端根本没有这个路径**。chat 服务里
    #         WebSocketHandler 真正注册的端点是
    #         `Constant.WEBSOCKET_CONNECT_PATH = "/ljl/bilibili/chat"`
    #         （见 chat/config/WebSocketConfig.registerWebSocketHandlers）。
    #         原来 nginx 把 `/wschat` 原样转发给 chat:1688 → chat 返回
    #         `HTTP/1.1 404 {"status":404,"error":"Not Found","path":"/wschat"}`（实测）。
    #         WebSocket 握手失败 → 浏览器触发 onerror（Event 对象 stringify 后就是 `[object Event]`，
    #         故报错文案里看不到真实原因，Console 才有关键信息）。
    #   处置：`rewrite ... break` 改写为真实端点。直连 chat:1688/ljl/bilibili/chat 实测
    #         `HTTP/1.1 101 Switching Protocols`（Sec-WebSocket-Accept 正确）。
    #   ⚠️ 与 /api/ 同理：变量形式 proxy_pass 下 nginx **不会**做任何自动改写，必须显式 rewrite。
    location /wschat {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $chat_upstream chat:1688;
        rewrite            ^/wschat$ /ljl/bilibili/chat break;
        proxy_pass         http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;   # 必须
        proxy_set_header   Connection "upgrade";        # 必须
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;                      # WS 长连接
    }

    # 3) 用户头像 → minio（FIX-12，2026-09-23 本机实测新增）
    #   动因：user_center 上传头像时写库的 URL 前缀是**硬编码**的 https://labilibili.com/
    #         （见 UserInfoServiceImpl.filePath），本地根本没有这个域名 → 头像全部破图。
    #         处置：库里/新上传的 URL 前缀一律换成本地入口 http://localhost:2023/，
    #         再由本段把 /user-cover/ 反代到 minio 的 user-cover 桶。
    #   ⚠️ 必须写 `^~`：下一段的静态资源正则 location（~* \.(png|jpg|...)$）**优先级高于**
    #      普通前缀 location，不加 ^~ 时 /user-cover/xxx.png 会被正则抢走 → 当作磁盘文件找 → 404。
    #   写法遵循 FIX-10：变量形式 proxy_pass + **显式** valid=10s，避免 minio 容器重建换 IP 后 502
    #      （不给 valid 时 Docker 内置 DNS 的 600s TTL 会让 nginx 最长 10 分钟仍指向旧 IP）。
    #   minio 侧桶权限为 anonymous download（minio-init 已执行 `mc anonymous set download`），
    #      故无需签名/Credential，直接匿名 GET 即可。
    location ^~ /user-cover/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $minio_upstream minio:9000;
        proxy_pass         http://$minio_upstream;      # 变量形式且不带 URI → 透传原始 URI
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 3b) 视频封面 + 视频本体 → minio（FIX-14，2026-09-23 本机实测新增）
    #   动因：video 服务把 video.url / video.cover 写成**浏览器侧地址**并直接落库，
    #         前端把它当 <video :src> / <img :src> 用（VideoCard.vue、videoDetail 页）。
    #         本次已把源码里写死的 http://localhost:9000/ 参数化为 ${minio.file-path:...}，
    #         容器侧（docker/config/video/application.yml）覆盖成本地入口 → 由本段提供这两个前缀。
    #   ⚠️ 同 /user-cover/：`^~` 不可省 —— 少了它，.jpg/.png 结尾的封面会被下一段的静态资源正则抢走 → 404。
    #   与前端路由 /videoDetail/:videoId 不冲突（这里要求前缀带斜杠，/videoDetail 不匹配 /video/）。
    location ^~ /video-cover/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $minio_upstream minio:9000;
        proxy_pass         http://$minio_upstream;      # 变量形式且不带 URI → 透传原始 URI
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 视频本体：Range 请求（拖进度条 / 边下边播）依赖 206 Partial Content。
    #   Range 与 If-Range 等请求头 nginx 默认就会透传，**不要**再 proxy_set_header 覆盖成空值。
    #   proxy_buffering off：否则 nginx 会先把整个对象缓冲到磁盘/内存再吐给浏览器，
    #   大文件下表现为「进度条卡住很久才开播」。
    location ^~ /video/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $minio_upstream minio:9000;
        proxy_pass         http://$minio_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # 4) 静态资源长缓存（带 hash 的产物）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 5) SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
